name: Validate and version plugins

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifests and marketplaces
        run: python scripts/plugin_versions.py
      - name: Test FEST import and search
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build .NET examples
        run: |
          dotnet build plugins/fest-251-ekspert/skills/instructions/examples/dotnet/HttpClient -c Release
          dotnet build plugins/fest-251-ekspert/skills/instructions/examples/dotnet/Wcf -c Release

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Increase unchanged versions and sync manifests
        env:
          BASE_COMMIT: ${{ github.event.before }}
        run: python scripts/plugin_versions.py --base "$BASE_COMMIT" --auto-patch --release-list /tmp/plugin-releases.txt
      - name: Commit version updates and tag releases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins .agents/plugins/marketplace.json .claude-plugin/marketplace.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: bump changed plugin versions'
            git push origin HEAD:main
          fi
          while IFS= read -r tag; do
            if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag already exists: $tag"
            else
              git tag "$tag"
              git push origin "refs/tags/$tag"
            fi
          done < /tmp/plugin-releases.txt
